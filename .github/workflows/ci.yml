name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and PDF support
        run: python -m pip install '.[research]'
      - name: Test with simulated models and local HTTP servers
        run: python -m unittest discover -s tests -v
      - name: Build and check release distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke test the installed wheel outside the source tree
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/square-harness" --help
          "$RUNNER_TEMP/wheel-smoke/bin/mathagent" --help
          "$RUNNER_TEMP/wheel-smoke/bin/python" -I - <<'PY'
          from importlib.resources import files
          for skill in ('literature', 'referee'):
              resource = files('mathagent').joinpath('skills', skill, 'SKILL.md')
              assert resource.read_text(encoding='utf-8').strip(), skill
          print('Both bundled skills are present in the installed wheel.')
          static = files('mathagent').joinpath('gui', 'static')
          for name in ('index.html', 'manifest.webmanifest', 'THIRD-PARTY-NOTICES.txt'):
              assert static.joinpath(name).is_file(), name
          assert any(item.name.endswith('.js') for item in static.joinpath('assets').iterdir())
          print('The visual interface is present in the installed wheel.')
          PY

  interface:
    name: Interface build matches its sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Type-check, test and build the interface
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Committed assets in mathagent/gui/static are up to date
        run: git status --porcelain -- mathagent/gui/static && git diff --exit-code -- mathagent/gui/static && test -z "$(git status --porcelain -- mathagent/gui/static)"

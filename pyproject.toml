[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "square-harness"
version = "0.5.1"
description = "An experimental solve-verify-repair harness for mathematical proof work"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Vincent Boulard"},
    {name = "Louis Carillo"},
]
keywords = ["mathematics", "research", "ollama", "llama.cpp", "vllm", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["rich>=13,<15", "prompt-toolkit>=3,<4"]

[project.urls]
Repository = "https://github.com/vincentboulard/Square-Harness"
Documentation = "https://github.com/vincentboulard/Square-Harness#readme"
Issues = "https://github.com/vincentboulard/Square-Harness/issues"

[project.optional-dependencies]
math = ["sympy>=1.12,<2", "numpy>=1.26,<3"]
research = ["pypdf>=5,<7"]
experiments = ["numpy>=1.26,<3", "scipy>=1.11,<2", "sympy>=1.12,<2", "mpmath>=1.3,<2", "matplotlib>=3.8,<4"]

[project.scripts]
square-harness = "mathagent.cli:main"
mathagent = "mathagent.cli:main"

[tool.setuptools.packages.find]
include = ["mathagent*"]

[tool.setuptools.package-data]
mathagent = ["skills/*/SKILL.md", "gui/static/**/*"]
